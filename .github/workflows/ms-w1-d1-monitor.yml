name: MS-W1-D1 Ichimoku Monitor

on:
  schedule:
    # Daily 22:30 UTC — after the US/Europe sessions close, so daily bars are
    # complete. Rare signal: checking once per day is more than enough.
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous state
        id: state
        uses: actions/download-artifact@v4
        with:
          name: monitor-state
          path: state
          merge-multiple: true
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r utilities/monitor/requirements.txt

      - name: Run MS-W1-D1 alignment monitor
        run: python utilities/monitor/monitor.py --state-dir state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state
          path: state/state.json
          if-no-files-found: error
